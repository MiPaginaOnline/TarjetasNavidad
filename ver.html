<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Navideña Recibida</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #0a3d1a 0%, #1a472a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .message-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid #ffd700;
        }

        .message-box i {
            color: #ffd700;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .action-button {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-family: 'Open Sans', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .btn-primary {
            background-color: #c62828;
            color: white;
        }

        .btn-primary:hover {
            background-color: #b71c1c;
            transform: translateY(-3px);
        }

        .btn-secondary {
            background-color: #1a472a;
            color: white;
            border: 3px solid #2e7d32;
        }

        .btn-secondary:hover {
            background-color: #2e7d32;
            transform: translateY(-3px);
        }

        .instructions {
            color: #e0f7d7;
            font-size: 1.1rem;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Has recibido una Tarjeta Navideña!</h1>
        
        <div class="message-box">
            <i class="fas fa-gift"></i>
            <p style="font-size: 1.3rem; margin-bottom: 15px;">
                Alguien quiere compartir contigo los buenos deseos de esta Navidad.
            </p>
            <p style="font-size: 1.1rem;">
                Para crear y compartir tu propia tarjeta navideña personalizada:
            </p>
        </div>
        
        <div class="action-buttons">
            <button class="action-button btn-primary" onclick="window.location.href = 'index.html'">
                <i class="fas fa-plus-circle"></i> CREAR MI TARJETA NAVIDEÑA
            </button>
            
            <button class="action-button btn-secondary" onclick="sharePage()">
                <i class="fas fa-share-alt"></i> COMPARTIR ESTA APP
            </button>
        </div>
        
        <div class="instructions">
            <i class="fas fa-lightbulb"></i>
            <strong>¡Es muy fácil!</strong> Solo escribe tu mensaje en la tarjeta y compártela con tus seres queridos.
        </div>
    </div>

    <script>
        // Función para compartir la app
        function sharePage() {
            const shareText = `🎄 ¡Crea tu propia tarjeta navideña personalizada! 🎄\n\nHaz tu tarjeta navideña única y compártela con quienes más quieres.\n\n${window.location.origin}${window.location.pathname.replace('ver.html', 'index.html')}`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'Creador de Tarjetas Navideñas',
                    text: '¡Crea tu propia tarjeta navideña personalizada!',
                    url: window.location.origin + window.location.pathname.replace('ver.html', 'index.html')
                });
            } else {
                // Fallback para WhatsApp
                const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
                window.open(whatsappUrl, '_blank');
            }
        }
        
        // Verificar si hay parámetros en la URL
        const urlParams = new URLSearchParams(window.location.search);
        const cardData = urlParams.get('data');
        
        if (cardData) {
            try {
                // Intentar mostrar datos si los hay
                const data = JSON.parse(decodeURIComponent(cardData));
                document.querySelector('.message-box').innerHTML += `
                    <div style="margin-top: 20px; padding: 15px; background: rgba(255,215,0,0.1); border-radius: 10px;">
                        <p><strong>De:</strong> ${data.sender || 'Alguien especial'}</p>
                        <p><strong>Mensaje:</strong> ${data.message || '¡Feliz Navidad!'}</p>
                    </div>
                `;
            } catch (e) {
                console.log('No se pudieron cargar datos de tarjeta');
            }
        }
    </script>
</body>
</html>
