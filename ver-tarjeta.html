<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Navideña Recibida</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #0a3d1a 0%, #1a472a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        header {
            text-align: center;
            width: 100%;
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .message-box {
            font-size: 1.2rem;
            color: #e0f7d7;
            margin-bottom: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #ffd700;
            width: 100%;
        }

        .message-box i {
            color: #ffd700;
            margin-right: 10px;
            font-size: 1.5rem;
        }

        .received-card {
            width: 100%;
            max-width: 450px;
            height: 600px;
            background-color: #0a3d1a;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 10px solid #8b4513;
        }

        .card-content {
            width: 100%;
            height: 100%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .card-header {
            text-align: center;
        }

        .card-title {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 2.8rem;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .recipient-display {
            font-size: 1.5rem;
            color: white;
            background: rgba(255, 215, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .card-message-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .message-display {
            width: 100%;
            padding: 20px;
            font-size: 1.8rem;
            text-align: center;
            color: #ffd700;
            font-family: 'Mountains of Christmas', cursive;
            line-height: 1.4;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-footer {
            text-align: center;
        }

        .sender-display {
            font-size: 1.5rem;
            color: #ffd700;
            font-weight: 600;
            background: rgba(255, 215, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        /* Christmas decorations */
        .snowflake {
            position: absolute;
            color: white;
            font-size: 1.2rem;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(600px);
            }
        }

        .ornament {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            z-index: 1;
        }

        .tree {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 40px solid #2e7d32;
            bottom: 20px;
            left: 20px;
        }

        .lights {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: twinkle 1.5s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .star {
            position: absolute;
            color: gold;
            font-size: 2rem;
            top: 20px;
            right: 30px;
            animation: spin 4s linear infinite;
        }

        .garland {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: linear-gradient(90deg, red, gold, green, red);
            opacity: 0.7;
            z-index: 1;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 450px;
            margin-top: 20px;
        }

        .action-button {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-family: 'Open Sans', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background-color: #c62828;
            color: white;
        }

        .btn-primary:hover {
            background-color: #b71c1c;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(198, 40, 40, 0.6);
        }

        .btn-secondary {
            background-color: #1a472a;
            color: white;
            border: 3px solid #2e7d32;
        }

        .btn-secondary:hover {
            background-color: #2e7d32;
            transform: translateY(-3px);
        }

        .error-message {
            text-align: center;
            background: rgba(198, 40, 40, 0.2);
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid #c62828;
            width: 100%;
        }

        .error-message h2 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.5rem;
            color: #ffd700;
        }

        .loading i {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: spin 2s linear infinite;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .received-card {
                height: 550px;
                max-width: 400px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .card-title {
                font-size: 2.3rem;
            }
            
            .message-display {
                font-size: 1.6rem;
            }
            
            .action-button {
                font-size: 1.3rem;
                padding: 18px;
            }
        }

        @media (max-width: 480px) {
            .received-card {
                height: 500px;
                max-width: 350px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .card-title {
                font-size: 2rem;
            }
            
            .message-display {
                font-size: 1.4rem;
                padding: 15px;
            }
            
            .action-button {
                font-size: 1.2rem;
                padding: 16px;
            }
            
            .message-box {
                font-size: 1rem;
                padding: 15px;
            }
        }

        @media (max-width: 360px) {
            .received-card {
                height: 450px;
                max-width: 300px;
            }
            
            .card-title {
                font-size: 1.8rem;
            }
            
            .message-display {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="pageTitle">Tarjeta Navideña</h1>
        </header>

        <div id="loadingIndicator" class="loading">
            <i class="fas fa-spinner"></i>
            <p>Cargando tu tarjeta navideña...</p>
        </div>

        <div id="messageContainer" style="display: none;">
            <!-- Mensaje de bienvenida o error -->
        </div>

        <div id="cardContainer" style="display: none;">
            <!-- La tarjeta recibida se mostrará aquí -->
        </div>

        <div id="actionButtons" class="action-buttons" style="display: none;">
            <button class="action-button btn-primary" id="shareButton">
                <i class="fas fa-share-alt"></i> COMPARTIR ESTA TARJETA
            </button>
            <button class="action-button btn-secondary" id="createButton">
                <i class="fas fa-plus-circle"></i> CREAR MI PROPIA TARJETA
            </button>
        </div>

        <div id="errorContainer" class="error-message" style="display: none;">
            <!-- Mensaje de error se mostrará aquí -->
        </div>
    </div>

    <script>
        // Obtener el ID de la tarjeta de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');
        
        // Elementos del DOM
        const loadingIndicator = document.getElementById('loadingIndicator');
        const messageContainer = document.getElementById('messageContainer');
        const cardContainer = document.getElementById('cardContainer');
        const actionButtons = document.getElementById('actionButtons');
        const errorContainer = document.getElementById('errorContainer');
        const pageTitle = document.getElementById('pageTitle');
        const shareButton = document.getElementById('shareButton');
        const createButton = document.getElementById('createButton');
        
        // Variable para almacenar datos de la tarjeta
        let cardData = null;
        
        // Función para cargar y mostrar la tarjeta
        function loadCard() {
            if (!cardId) {
                showError('No se encontró una tarjeta para mostrar.', 'El enlace no contiene información de tarjeta.');
                return;
            }
            
            // Intentar cargar la tarjeta desde localStorage
            try {
                const storedCard = localStorage.getItem(cardId);
                
                if (!storedCard) {
                    // Si no está en localStorage, intentar con 'ultima_tarjeta'
                    if (cardId === 'ultima_tarjeta') {
                        const lastCard = localStorage.getItem('ultima_tarjeta');
                        if (lastCard) {
                            cardData = JSON.parse(lastCard);
                            displayCard();
                            return;
                        }
                    }
                    
                    showError('Tarjeta no encontrada', 'La tarjeta que buscas no existe o ha expirado.');
                    return;
                }
                
                cardData = JSON.parse(storedCard);
                displayCard();
                
            } catch (error) {
                console.error('Error al cargar la tarjeta:', error);
                showError('Error al cargar la tarjeta', 'Hubo un problema al cargar la tarjeta. Intenta de nuevo.');
            }
        }
        
        // Función para mostrar la tarjeta
        function displayCard() {
            // Ocultar indicador de carga
            loadingIndicator.style.display = 'none';
            
            // Mostrar mensaje de bienvenida
            const welcomeMessage = `
                <div class="message-box">
                    <i class="fas fa-gift"></i>
                    <strong>¡Has recibido una tarjeta navideña!</strong>
                    <p>${cardData.sender} te ha enviado este mensaje especial:</p>
                </div>
            `;
            
            messageContainer.innerHTML = welcomeMessage;
            messageContainer.style.display = 'block';
            
            // Actualizar título de la página
            pageTitle.textContent = `Tarjeta para ${cardData.recipient}`;
            
            // Crear y mostrar la tarjeta
            const cardHTML = `
                <div class="received-card" id="receivedCard">
                    <div class="garland"></div>
                    <div class="star"><i class="fas fa-star"></i></div>
                    
                    <!-- Decoraciones navideñas -->
                    <div class="ornament" style="background-color: #c62828; top: 60px; left: 50px;"></div>
                    <div class="ornament" style="background-color: #ffd700; top: 120px; right: 60px;"></div>
                    <div class="ornament" style="background-color: #2196f3; bottom: 100px; left: 80px;"></div>
                    <div class="lights" style="background-color: #ff5722; top: 90px; left: 100px;"></div>
                    <div class="lights" style="background-color: #4caf50; bottom: 150px; right: 100px;"></div>
                    <div class="lights" style="background-color: #9c27b0; top: 180px; left: 150px;"></div>
                    <div class="tree"></div>
                    
                    <!-- Copos de nieve dinámicos se agregarán con JavaScript -->
                    
                    <div class="card-content">
                        <div class="card-header">
                            <div class="card-title">¡Feliz Navidad!</div>
                            <div class="recipient-display">Para: ${cardData.recipient}</div>
                        </div>
                        
                        <div class="card-message-area">
                            <div class="message-display">${cardData.message}</div>
                        </div>
                        
                        <div class="card-footer">
                            <div class="sender-display">De: ${cardData.sender}</div>
                        </div>
                    </div>
                </div>
            `;
            
            cardContainer.innerHTML = cardHTML;
            cardContainer.style.display = 'block';
            
            // Aplicar color de fondo
            const receivedCard = document.getElementById('receivedCard');
            if (receivedCard && cardData.color) {
                receivedCard.style.backgroundColor = cardData.color;
            }
            
            // Añadir efectos navideños
            addChristmasEffects();
            
            // Mostrar botones de acción
            actionButtons.style.display = 'flex';
        }
        
        // Función para mostrar error
        function showError(title, message) {
            loadingIndicator.style.display = 'none';
            
            const errorHTML = `
                <div class="error-message">
                    <h2><i class="fas fa-exclamation-triangle"></i> ${title}</h2>
                    <p>${message}</p>
                    <p>Puedes crear tu propia tarjeta navideña:</p>
                    
                    <div class="action-buttons" style="margin-top: 20px; display: flex;">
                        <button class="action-button btn-primary" onclick="window.location.href = 'tarjeta-navideña.html'">
                            <i class="fas fa-plus-circle"></i> CREAR TARJETA NAVIDEÑA
                        </button>
                    </div>
                </div>
            `;
            
            errorContainer.innerHTML = errorHTML;
            errorContainer.style.display = 'block';
        }
        
        // Función para añadir efectos navideños
        function addChristmasEffects() {
            const card = document.getElementById('receivedCard');
            if (!card) return;
            
            // Añadir copos de nieve
            for (let i = 0; i < 10; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = Math.random() > 0.5 ? '❅' : '❆';
                snowflake.style.left = `${Math.random() * 100}%`;
                snowflake.style.animationDuration = `${8 + Math.random() * 12}s`;
                snowflake.style.fontSize = `${1 + Math.random() * 1}rem`;
                snowflake.style.opacity = `${0.5 + Math.random() * 0.5}`;
                
                card.appendChild(snowflake);
            }
            
            // Añadir luces parpadeantes
            for (let i = 0; i < 8; i++) {
                const light = document.createElement('div');
                light.className = 'lights';
                light.style.backgroundColor = i % 3 === 0 ? '#ff5722' : (i % 3 === 1 ? '#4caf50' : '#9c27b0');
                light.style.top = `${30 + Math.random() * 500}px`;
                light.style.left = `${20 + Math.random() * 380}px`;
                light.style.animationDelay = `${Math.random() * 2}s`;
                
                card.appendChild(light);
            }
        }
        
        // Función para compartir la tarjeta actual
        function shareCurrentCard() {
            if (!cardData) return;
            
            const shareText = `🎄 ¡Mira la tarjeta navideña que recibí! 🎄\n\n${cardData.sender} me envió: "${cardData.message}"\n\nPara: ${cardData.recipient}\n\n✨ Crea tu propia tarjeta aquí: ${window.location.origin}${window.location.pathname.replace('ver-tarjeta.html', 'tarjeta-navideña.html')} ✨`;
            
            // Intentar usar la Web Share API
            if (navigator.share) {
                navigator.share({
                    title: 'Tarjeta Navideña Recibida',
                    text: shareText,
                    url: window.location.href
                }).catch(error => {
                    console.log('Error al compartir:', error);
                    fallbackShare(shareText);
                });
            } else {
                fallbackShare(shareText);
            }
        }
        
        // Función de respaldo para compartir
        function fallbackShare(text) {
            // Para WhatsApp
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
            
            if (confirm('¿Quieres compartir por WhatsApp?\n\nSi prefieres otra app, copia el mensaje y pégalo donde quieras.')) {
                window.open(whatsappUrl, '_blank');
            } else {
                // Copiar al portapapeles
                navigator.clipboard.writeText(text).then(() => {
                    alert('✅ Mensaje copiado al portapapeles.\n\nAhora puedes pegarlo en WhatsApp, Mensajes, Facebook, Correo, o donde quieras compartirlo.');
                }).catch(() => {
                    // Fallback para navegadores antiguos
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    alert('✅ Mensaje copiado al portapapeles.\n\nAhora puedes pegarlo en WhatsApp, Mensajes, Facebook, Correo, o donde quieras compartirlo.');
                });
            }
        }
        
        // Función para ir a crear tarjeta
        function goToCreateCard() {
            window.location.href = 'tarjeta-navideña.html';
        }
        
        // Configurar eventos de botones
        shareButton.addEventListener('click', shareCurrentCard);
        createButton.addEventListener('click', goToCreateCard);
        
        // Cargar la tarjeta cuando la página esté lista
        window.addEventListener('DOMContentLoaded', loadCard);
        
        // También intentar cargar si hay un parámetro en la URL
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadCard);
        } else {
            loadCard();
        }
    </script>
</body>
</html>
